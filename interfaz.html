<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cerebro Agent - Oficina Virtual</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --cpu-glow: #38bdf8;
            --ram-glow: #a78bfa;
            --disk-glow: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            color: white;
        }

        /* iOS Glass Dashboard Contenedor */
        .dashboard {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Cabecera limpia iOS */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.5px; }
        .header p { color: #a1a1aa; font-size: 0.9rem; }

        /* El Cuarto de la Oficina (Vista Top-Down 2.5D) */
        .office-room {
            flex-grow: 1;
            background: linear-gradient(135deg, #18181b 0%, #0f0f12 100%);
            border-radius: 30px;
            border: 2px solid #27272a;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.8);
            /* Piso de oficina */
            background-image: 
                radial-gradient(rgba(255,255,255,0.05) 2px, transparent 2px),
                radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px, 20px 20px;
        }

        /* Elementos de Oficina (Decoración) */
        .plant { position: absolute; font-size: 2.5rem; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); z-index: 2;}
        .plant-1 { top: 20px; left: 20px; }
        .plant-2 { bottom: 20px; right: 20px; transform: scaleX(-1); }
        .water-cooler { position: absolute; font-size: 2.5rem; top: 20px; right: 30px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); z-index: 2;}

        /* Estaciones de Trabajo (Servidores / Archivos) */
        .station {
            position: absolute;
            background: rgba(39, 39, 42, 0.8);
            border-top: 3px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 15px;
            width: 180px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 -5px 15px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        /* Sombra base 3D de los servidores */
        .station::after {
            content: '';
            position: absolute;
            bottom: -15px;
            width: 70%;
            height: 10px;
            background: rgba(0,0,0,0.6);
            filter: blur(5px);
            border-radius: 50%;
        }

        /* Posiciones en el mapa */
        .station.cpu { top: 15%; left: 12%; border-bottom: 2px solid var(--cpu-glow); }
        .station.ram { top: 15%; right: 12%; border-bottom: 2px solid var(--ram-glow); }
        .station.disk { bottom: 10%; left: 12%; width: 220px; border-bottom: 2px solid var(--disk-glow); }

        .station h3 { font-size: 0.9rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;}
        .station-value { font-size: 1.8rem; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
        
        .station.cpu .station-value { color: var(--cpu-glow); text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .station.ram .station-value { color: var(--ram-glow); text-shadow: 0 0 15px rgba(167, 139, 250, 0.4); }
        .station.disk .station-value { color: var(--disk-glow); text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        /* Escritorio Central (BASE) */
        .home-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 120px;
            background: #27272a;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 5px 10px rgba(255,255,255,0.1);
            border-bottom: 5px solid #18181b;
            z-index: 5;
        }
        
        /* Detalles sobre el escritorio (Laptops, café, documentos) */
        .home-base::before {
            content: '💻 ☕ 📋';
            font-size: 1.5rem;
            position: absolute;
            top: 20px;
            letter-spacing: 15px;
            opacity: 0.8;
        }

        /* Agentes */
        .agent {
            font-size: 2.5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -20px; 
            margin-left: -20px;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
        }

        /* Panel lateral / UI superpuesta flotante */
        .action-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 24px;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255,255,255,0.3);
        }

        button:disabled {
            background: #3f3f46;
            color: #a1a1aa;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Efectos visuales de inspección (Neón parpadeando) */
        .scanning {
            animation: pulse-glow 1s infinite alternate;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 -5px 15px rgba(0,0,0,0.5), 0 0 0px transparent; }
            to { box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 -5px 15px rgba(0,0,0,0.5), 0 0 35px currentColor; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <div>
                <h1>Centro de Operaciones Táctico</h1>
                <p>Monitoreo local en tiempo real</p>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: 500;">
                <span style="color: #4ade80;">●</span> Sistema en línea
            </div>
        </div>

        <div class="office-room" id="office">
            <!-- Decoración de la Oficina -->
            <div class="plant plant-1">🪴</div>
            <div class="plant plant-2">🪴</div>
            <div class="water-cooler">🚰</div>

            <!-- Servidores / Archiveros -->
            <div class="station cpu" id="stat-cpu" style="color: var(--cpu-glow)">
                <span style="font-size: 2.5rem;">🖥️</span>
                <h3>Procesador</h3>
                <div class="station-value" id="val-cpu">--%</div>
            </div>

            <div class="station ram" id="stat-ram" style="color: var(--ram-glow)">
                <span style="font-size: 2.5rem;">🗄️</span>
                <h3>Memoria RAM</h3>
                <div class="station-value" id="val-ram">--%</div>
            </div>

            <div class="station disk" id="stat-disk" style="color: var(--disk-glow)">
                <span style="font-size: 2.5rem;">🗃️</span>
                <h3>Almacenamiento (C:)</h3>
                <div class="station-value" id="val-disk">--%</div>
            </div>

            <!-- Escritorio Central y Agentes -->
            <div class="home-base">
                <div class="agent" id="a1">🧑‍💻</div>
                <div class="agent" id="a2">👩‍💻</div>
            </div>

            <!-- Panel de Control Flotante -->
            <div class="action-panel">
                <p style="color: #a1a1aa; font-size: 0.85rem; margin-bottom: 12px; font-weight: 600; letter-spacing: 1px;">CONTROL DE AGENTES</p>
                <button id="btn" onclick="inspeccionar()">
                    <span>🚀</span> Iniciar Auditoría
                </button>
            </div>
        </div>
    </div>

    <script>
        async function inspeccionar() {
            const btn = document.getElementById('btn');
            btn.innerHTML = "<span>⏳</span> Analizando red...";
            btn.disabled = true;

            const a1 = document.getElementById('a1');
            const a2 = document.getElementById('a2');
            const statCpu = document.getElementById('stat-cpu');
            const statRam = document.getElementById('stat-ram');
            const statDisk = document.getElementById('stat-disk');
            
            // Calculamos el tamaño de la oficina dinámicamente para que caminen exacto a los servidores
            const office = document.getElementById('office');
            const rect = office.getBoundingClientRect();
            
            // Animación 1: Los agentes salen del escritorio hacia el CPU y RAM (Arriba)
            a1.style.transform = `translate(-${rect.width * 0.3}px, -${rect.height * 0.25}px) scale(1.1)`;
            a2.style.transform = `translate(${rect.width * 0.3}px, -${rect.height * 0.25}px) scale(1.1)`;
            
            // Se encienden las luces de neón
            statCpu.classList.add('scanning');
            statRam.classList.add('scanning');

            let data = { cpu: 'Err', ram: 'Err' };
            try { 
                const res = await fetch('/api/data'); 
                data = await res.json(); 
            } catch(e){ console.error("Sin conexión al servidor"); }

            setTimeout(() => {
                // Actualizan pantallas
                document.getElementById('val-cpu').innerText = data.cpu + '%';
                document.getElementById('val-ram').innerText = data.ram + '%';
                
                // Regresan a la base a dejar su reporte
                a1.style.transform = 'translate(0, 0) scale(1)';
                a2.style.transform = 'translate(0, 0) scale(1)';
                statCpu.classList.remove('scanning');
                statRam.classList.remove('scanning');
                
                setTimeout(() => {
                    // Animación 2: El agente 1 va al archivo del Disco Duro (Abajo)
                    a1.style.transform = `translate(-${rect.width * 0.25}px, ${rect.height * 0.3}px) scale(1.1)`;
                    statDisk.classList.add('scanning');
                    
                    setTimeout(() => {
                        // Imprime el valor
                        document.getElementById('val-disk').innerText = "OK";
                        
                        setTimeout(() => {
                            // Regresa a sentarse en la base
                            a1.style.transform = 'translate(0, 0) scale(1)';
                            statDisk.classList.remove('scanning');
                            
                            setTimeout(() => {
                                btn.innerHTML = "<span>🚀</span> Iniciar Auditoría";
                                btn.disabled = false;
                            }, 800);
                        }, 800);
                    }, 800);
                }, 800);
            }, 1200);
        }
    </script>
</body>
</html>
